<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Updaterr</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script>try { const t = localStorage.getItem('updaterr.theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
  <!-- Ikony (vlastní, ve stylu Lucide) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/></symbol>
      <symbol id="i-headphones" viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></symbol>
      <symbol id="i-library" viewBox="0 0 24 24"><path d="m16 6 4 14M12 6v14M8 8v12M4 4v16"/></symbol>
      <symbol id="i-activity" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></symbol>
      <symbol id="i-log" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></symbol>
      <symbol id="i-merge" viewBox="0 0 24 24"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></symbol>
      <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 12h18M3 7.5h4M3 16.5h4M17 7.5h4M17 16.5h4"/></symbol>
      <symbol id="i-tv" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="m17 2-5 5-5-5"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
      <symbol id="i-ban" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7l10-5Z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
      <symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/></symbol>
      <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2Z"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></symbol>
      <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/><path d="M3 3v5h5"/></symbol>
      <symbol id="i-archive" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></symbol>
      <symbol id="i-plug" viewBox="0 0 24 24"><path d="M12 22v-5M9 8V2M15 8V2M18 8v5a6 6 0 0 1-12 0V8Z"/></symbol>
    </defs>
  </svg>

  <a class="skip" href="#main" data-i18n="nav.skip">Přeskočit na obsah</a>

  <header class="topbar">
    <div class="brand"><img src="icon.svg" alt="" width="28" height="28"><span>Updaterr</span></div>
    <nav class="tabs" id="tabs" aria-label="Sekce" data-i18n-aria-label="nav.sections">
      <button data-tab="proposals" data-i18n-title="nav.proposals" data-i18n-aria-label="nav.proposals" aria-current="page"><svg class="ic"><use href="#i-inbox"/></svg><span data-i18n="nav.proposals">Návrhy</span><b class="count" id="count-proposals" hidden></b></button>
      <button data-tab="library" data-i18n-title="nav.library" data-i18n-aria-label="nav.library"><svg class="ic"><use href="#i-library"/></svg><span data-i18n="nav.library">Knihovna</span></button>
      <button data-tab="activity" data-i18n-title="nav.activity" data-i18n-aria-label="nav.activity"><svg class="ic"><use href="#i-activity"/></svg><span data-i18n="nav.activity">Aktivita</span><b class="count" id="count-activity" hidden></b></button>
      <button data-tab="backups" data-i18n-title="nav.backups" data-i18n-aria-label="nav.backups"><svg class="ic"><use href="#i-archive"/></svg><span data-i18n="nav.backups">Zálohy</span></button>
      <button data-tab="log" data-i18n-title="nav.log" data-i18n-aria-label="nav.log"><svg class="ic"><use href="#i-log"/></svg><span data-i18n="nav.log">Log</span></button>
      <button data-tab="settings" data-i18n-title="nav.settings" data-i18n-aria-label="nav.settings"><svg class="ic"><use href="#i-settings"/></svg><span data-i18n="nav.settings">Nastavení</span></button>
    </nav>
    <div class="topbar-end">
      <div class="pulse" id="pulse" role="status" aria-live="polite"></div>
      <div class="nc-wrap">
        <button class="icon-btn nc-btn" id="nc-btn" aria-label="Oznámení" title="Oznámení" data-i18n-title="notif.title" data-i18n-aria-label="notif.title" aria-expanded="false" aria-controls="nc-panel"><svg class="ic"><use href="#i-bell"/></svg><b class="nc-count" id="nc-count" hidden></b></button>
        <div class="nc-panel" id="nc-panel" role="dialog" aria-labelledby="nc-title" hidden></div>
      </div>
      <button class="icon-btn" id="theme" title="Přepnout světlý/tmavý vzhled" aria-label="Přepnout vzhled" data-i18n-title="nav.themeTitle" data-i18n-aria-label="nav.theme"><svg class="ic"><use href="#i-moon"/></svg></button>
    </div>
  </header>

  <div id="banner" class="banner" role="status" hidden></div>

  <main id="main" tabindex="-1">
    <section id="view-proposals" class="view"></section>
    <section id="view-library" class="view" hidden></section>
    <section id="view-activity" class="view" hidden></section>
    <section id="view-backups" class="view" hidden></section>
    <section id="view-log" class="view" hidden></section>
    <section id="view-settings" class="view" hidden></section>
  </main>

  <!-- Detail položky -->
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawer-title" role="dialog"></aside>

  <!-- Potvrzení -->
  <dialog class="modal" id="confirm">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="modal-actions">
        <button value="cancel" class="btn ghost" data-i18n="common.back">Zpět</button>
        <button value="ok" class="btn primary" id="confirm-ok" data-i18n="common.confirm">Potvrdit</button>
      </div>
    </form>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <!-- Hromadná kontrola (Knihovna) -->
  <dialog class="modal modal-wide" id="bulk" aria-labelledby="bulk-title">
    <form method="dialog">
      <h2 id="bulk-title" data-i18n="bulk.title">Hromadná kontrola</h2>
      <div id="bulk-body"></div>
      <div class="modal-actions">
        <button value="cancel" class="btn ghost" data-i18n="common.back">Zpět</button>
        <button value="ok" class="btn primary" id="bulk-ok" data-i18n="bulk.start">Spustit</button>
      </div>
    </form>
  </dialog>

  <script src="i18n.js"></script>
  <script src="lib.js"></script>
</body>
</html>
